<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QueryPilot</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<!-- Aurora stage. -->
<div class="screen">
<div class="aurora a1"></div>
<div class="aurora a2"></div>
<div class="dots-bg"></div>

<div class="wrap">
<!-- Brand header. -->
<header class="top">
<div class="logo">🧭</div>
<h1>QueryPilot</h1>
<p>Ask in English, get safe SQL.</p>
<div class="pills">
<span class="pill">✓ Safe SQL</span>
<span class="pill">⚡ Redis Cache</span>
<span class="pill">★ Eval 5/5</span>
</div>
</header>

<!-- Main card. -->
<!-- Main card. -->
<main class="card">
<!-- Login box. Token stays in page only. -->
<h2>🔑 Login</h2>
<div class="row">
<input id="name" type="text" placeholder="Name (amit / neha / ravi)" />
<input id="pw" type="password" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()" />
<button onclick="doLogin()">Login</button>
</div>
<p id="who" class="hint">Not logged in.</p>

<h2>✨ Try examples</h2>
<!-- 5 grey chips, same shade. -->
<div class="grid">
<button class="ex" onclick="fill('last 30 days city-wise orders?')"><span>📍</span> last 30 days city-wise orders?</button>
<button class="ex" onclick="fill('last 30 days state-wise orders?')"><span>🗺️</span> last 30 days state-wise orders?</button>
<button class="ex" onclick="fill('where are my orders?')"><span>❓</span> where are my orders?</button>
<button class="ex" onclick="fill('show sales last 30 days?')"><span>📊</span> show sales last 30 days?</button>
<button class="ex" onclick="fill('show paid orders?')"><span>💰</span> show paid orders?</button>
</div>

<!-- Ask box. Enter key works. -->
<div class="row">
<input id="q" type="text" placeholder="Ask question..." onkeydown="if(event.key==='Enter')ask()" />
<button id="ask" onclick="ask()">Ask →</button>
</div>
<p class="hint">Press <b>Enter</b> to run • Safe SELECT only • org_id auto-safe</p>

<!-- Clarify buttons show here. -->
<div id="help" class="hide"></div>

<!-- SQL answer card shows here. -->
<div id="ans" class="hide">
<div class="ansbar">
<span class="dots"><i></i><i></i><i></i></span>
<span id="badge" class="badge hide"></span>
<button class="copy" onclick="copySql()">Copy</button>
</div>
<pre id="out"></pre>
</div>

<p class="foot">Safe by guard • Fast by cache • Clear by clarify</p>
</main>
</div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
